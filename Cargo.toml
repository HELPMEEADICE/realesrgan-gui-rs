[package]
name = "realesrgan-gui"
version = "1.0.0"
edition = "2021"
description = "A Fluent Design GUI for Real-ESRGAN-ncnn-vulkan / Real-CUGAN-ncnn-vulkan / Upscayl, written in Rust with Slint"
authors = ["TransparentLC", "HELPMEEADICE"]
license = "GPL-3.0-or-later"
repository = "https://github.com/HELPMEEADICE/realesrgan-gui-rs"
readme = "README.md"
build = "build.rs"
exclude = ["_probe_slint/**"]

[dependencies]
slint = { version = "1.18", features = ["renderer-software", "raw-window-handle-06"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "ico"] }
webp = "0.3"
rfd = "0.17"
shlex = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
raw-window-handle = "0.6"
tauri-winrt-notification = "0.8"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
