[package]
name = "realesrgan-gui"
version = "1.0.0"
edition = "2021"
description = "A Fluent Design GUI for Real-ESRGAN-ncnn-vulkan / Real-CUGAN-ncnn-vulkan / Upscayl, written in Rust with Slint"
authors = ["TransparentLC", "HELPMEEADICE"]
license = "GPL-3.0-or-later"
repository = "https://github.com/HELPMEEADICE/realesrgan-gui-rs"
readme = "README.md"
build = "build.rs"
exclude = ["_probe_slint/**"]

[dependencies]
slint = { version = "1.18", features = ["renderer-software", "raw-window-handle-06"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "ico"] }
webp = "0.3"
rfd = "0.17"
shlex = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The `#[implement]` macro expands to `::windows_core::...` paths, so the
# crate has to be a direct dependency instead of only a re-export.
windows-core = "0.62"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
# Embeds icon-256px.ico and the version metadata into the executable.
winresource = "=0.1.31"

[profile.release]
# 性能优先的发布配置：最高优化等级 + Fat LTO + 单 codegen unit，
# 让跨 crate 内联与 LLVM 全局优化发挥到极限（代价是编译时间变长）。
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = false
strip = true

# 依赖同样按最高等级优化（Fat LTO 会一并参与链接期优化）。
[profile.release.package."*"]
opt-level = 3
