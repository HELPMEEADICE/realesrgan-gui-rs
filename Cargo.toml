[package]
name = "realesrgan-gui"
version = "1.0.0"
edition = "2021"
description = "A Fluent Design GUI for Real-ESRGAN-ncnn-vulkan / Real-CUGAN-ncnn-vulkan / Upscayl, written in Rust with Slint"
authors = ["TransparentLC", "HELPMEEADICE"]
license = "GPL-3.0-or-later"
repository = "https://github.com/HELPMEEADICE/realesrgan-gui-rs"
readme = "README.md"
build = "build.rs"
exclude = ["_probe_slint/**"]

[dependencies]
# Slint 的默认特性会额外编入 femtovg/OpenGL 渲染器、AccessKit 无障碍支持和
# 系统托盘，而本项目只用软件渲染器。这里关闭默认特性、只保留运行必需的部分，
# 可以在三个平台上都显著减小可执行文件体积。
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
    # Slint 1.18 要求显式打开兼容性开关；它是空特性，不会带进额外依赖。
    "compat-1-18",
] }
anyhow = "1"
# `ico` 会顺带启用 bmp 解码，但应用的扩展名白名单里没有这两种格式，去掉可以
# 省下这部分解码器（PNG/JPEG/GIF/WebP/TIFF 仍完整保留）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
# 只使用 libwebp 的原始 RGB/RGBA 编码接口，不需要默认的 `img` 适配层。
webp = { version = "0.3", default-features = false }
rfd = "0.17"
shlex = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The `#[implement]` macro expands to `::windows_core::...` paths, so the
# crate has to be a direct dependency instead of only a re-export.
windows-core = "0.62"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
# Embeds icon-256px.ico and the version metadata into the executable.
winresource = "=0.1.31"

[profile.release]
# 体积优先的发布配置：`z` 会让 LLVM 放弃以体积换速度的优化，再叠加 Fat LTO、
# 单 codegen unit、abort panic 和符号剥离，尽可能压缩最终二进制。
# 真正的重计算（Real-ESRGAN 推理）在外部 ncnn 进程中完成，
# 因此这里牺牲一点 Rust 侧速度来换取更小的分发包是划算的。
#
# 把这些选项写全（包括本来就是 release 默认值的 debug / debug-assertions）
# 是为了让「体积优先」这件事在文件里自洽，而不是靠记忆里的默认值。
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = false
debug = false
debug-assertions = false
# macOS 默认会额外产出 .dSYM；分发包里用不到，关掉既能少生成文件也能缩短构建。
split-debuginfo = "off"
strip = true

# 再往下的体积收益要靠 libstd 本身，那需要 nightly 的
# `-Z build-std=std,panic_abort -Z build-std-features=panic_immediate_abort`
# 与 `-Zlocation-detail=none`。这些开关不能写进 Cargo.toml（stable 上会被拒绝），
# 所以放在 .github/workflows/build.yml 的发布流水线里执行；
# 本地用 stable 直接 `cargo build --release` 仍然得到与上面这套配置一致的结果。

# 依赖也按体积优先生成，避免第三方 crate 把 `opt-level = 3` 的体积带回来。
[profile.release.package."*"]
opt-level = "z"
