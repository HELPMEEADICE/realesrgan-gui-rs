name: update-lock

# Temporary helper: regenerate Cargo.lock after changing dependency features.
# The build environment is not allowed to run cargo locally, so this workflow
# performs the minimal lockfile refresh on a GitHub runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh lockfile
        run: cargo metadata --format-version 1 > /dev/null

      - name: Show lockfile diff
        run: git diff --stat -- Cargo.lock && git diff -- Cargo.lock

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
