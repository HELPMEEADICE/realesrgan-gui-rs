name: build

# 六个平台的可执行程序打包：
#   Windows x86_64 / Windows AArch64 / Linux x86_64 / Linux AArch64 / macOS x86_64 / macOS AArch64
#
# 触发方式：
#   * Release 发布（published）：六个 zip 打包完成后追加到该 Release 的资产里。
#   * 手动触发（workflow_dispatch）：只上传到 Actions artifacts，
#     在本次运行的页面底部即可直接下载，不会碰任何 Release。
#
# 六个 artifact / zip 一一对应：
#   realesrgan-gui-windows-x86_64    realesrgan-gui-windows-aarch64
#   realesrgan-gui-linux-x86_64      realesrgan-gui-linux-aarch64
#   realesrgan-gui-macos-x86_64      realesrgan-gui-macos-aarch64
# 每个包里只有一个可执行程序，不含安装包、模型或 Real-ESRGAN-ncnn-vulkan。
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 这里刻意不允许取消：一次构建要跑十几分钟、六个平台，中途被新运行打断只会
  # 留下一堆 cancelled 的 job 和半套产物。手动触发的重复运行会排队串行执行，
  # 代价是多花 runner 分钟，但任何一次结果都不会被悄悄丢掉。
  # Release 之间本来就因 tag 不同而落在不同的 group 里，互不影响。
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Fat LTO + 单 codegen unit 的 release 构建本身就慢，
    # 某台机器卡住时尽早失败，而不是让整条流水线挂在那里。
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 六个产物一一对应，artifact 名就是 Actions 里下载到的 zip 名。
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: realesrgan-gui.exe
            artifact: realesrgan-gui-windows-x86_64
          # Windows 的 aarch64 用 GitHub 官方的 arm64 托管机原生构建
          # （windows-11-arm，公开仓库可用）。万一某个 action 在 arm64 Windows 上
          # 还不兼容，或者这个 label 在你的套餐里拿不到，替代方案是在 windows-latest
          # 上交叉编译：windows 镜像自带 MSVC 的 ARM64 工具集，
          # 执行 `rustup target add aarch64-pc-windows-msvc` 后照常 --target 构建即可。
          - name: Windows AArch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: realesrgan-gui.exe
            artifact: realesrgan-gui-windows-aarch64
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: realesrgan-gui
            artifact: realesrgan-gui-linux-x86_64
          - name: Linux AArch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: realesrgan-gui
            artifact: realesrgan-gui-linux-aarch64
          # macOS 两个架构各用自己的原生托管机：x86_64 用固定的 macos-15-intel，
          # aarch64 用 macos-15（arm64）。注意 macos-latest 现在指向 macOS 26 的
          # arm64 镜像，arm64 机池闲时会排队，万一某个 job 拿不到机器会被取消
          # （annotations 里的 “The job was not acquired by Runner of type hosted
          # even after multiple attempts”），此时单独重跑这个 job 即可；
          # fail-fast: false 保证它不会带崩另外五个产物。
          # 两个 macOS job 都是原生编译，不需要 lipo 合成 universal2。
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: realesrgan-gui
            artifact: realesrgan-gui-macos-x86_64
          - name: macOS AArch64
            os: macos-15
            target: aarch64-apple-darwin
            bin: realesrgan-gui
            artifact: realesrgan-gui-macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          # Release 触发时构建该 tag 的源码；手动触发时用界面上选中的分支。
          ref: ${{ github.event.release.tag_name || github.ref }}

      # 体积优先的发布构建用 nightly：release profile 已经压满
      # （-Oz / Fat LTO / 单 codegen unit / panic=abort / strip），此时还能再砍的
      # 最大一块是 libstd 本身——它仍按 -O3 编译，并且带着整条 panic 格式化链路。
      # 下面的 `-Z build-std` 让 std 也走同一套体积优先参数，
      # `panic_immediate_abort` 再把 panic 直接变成 abort。两者在 stable 上不可用，
      # 所以只有这个「出分发包」的流水线换成 nightly；ci.yml 的检查与冒烟仍跑 stable。
      # 万一某次 nightly 抖动导致构建失败，把版本钉到具体日期即可，
      # 例如 dtolnay/rust-toolchain@nightly-2026-01-01。
      - name: Setup Rust（nightly + rust-src，供 build-std 使用）
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # 缓存键带上 runner.arch 和 target：六个产物的 target 目录不能混用。
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # Slint 的 winit 后端在 Linux 上需要窗口系统相关的开发包；
      # 界面走软件渲染器，不需要 OpenGL 开发包。
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev

      # build.rs 会把 REGUI_BUILD_TIME 编进「关于」页面，让产物能追溯到具体一次构建。
      - name: Export build time
        shell: bash
        run: echo "REGUI_BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      # 体积开关（都只在 nightly 上可用）：
      #   -Z build-std=std,panic_abort
      #       让 std 也按 Cargo.toml 的 [profile.release]（opt-level = "z"、Fat LTO）
      #       重新编译，而不是沿用发行版预先优化的 -O3 std；
      #   panic = "immediate-abort"
      #       真正的 abort 策略：panic 直接调 intrinsics::abort()，std 里格式化参数、
      #       位置信息、Backtrace 那条链路全部不进产物。旧的
      #       -Z build-std-features=panic_immediate_abort 已经退役，nightly 现在只会
      #       报 compile_error 让你改用这个策略；这个值 stable 不认，所以不写进
      #       Cargo.toml，而是用 CARGO_PROFILE_RELEASE_PANIC 只覆盖这一次构建，
      #       -Zpanic-immediate-abort 则是它的 cargo 特性门；
      #   -Zlocation-detail=none
      #       连 panic 位置里的文件/行号字符串也一并去掉。
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: -Zlocation-detail=none
        run: |
          set -euo pipefail
          if CARGO_PROFILE_RELEASE_PANIC=immediate-abort \
             cargo build --release --locked --target "$TARGET" \
               -Zpanic-immediate-abort \
               -Z build-std=std,panic_abort; then
            exit 0
          fi
          # 保底：immediate-abort 万一在某个平台或某天的 nightly 上不可用，退回普通
          # abort 策略继续出包（std 仍按 -Oz 重编，只是略大一点），而不是让整条
          # 发布流水线挂掉。
          echo "::warning title=panic-strategy::panic=immediate-abort 不可用，已回退到 panic=abort（产物略大）"
          cargo build --release --locked --target "$TARGET" -Z build-std=std,panic_abort

      # 产物自检：文件存在、架构对得上，顺便把体积写进 Actions 摘要。
      - name: Verify binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin }}
          LABEL: ${{ matrix.name }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/${BIN_NAME}"
          if [ ! -f "$BIN" ]; then
            echo "::error::未找到构建产物 $BIN"
            exit 1
          fi
          chmod +x "$BIN" 2>/dev/null || true

          BYTES=$(wc -c < "$BIN")
          MIB=$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "### ${LABEL}：${MIB} MiB（${BYTES} 字节）" >> "$GITHUB_STEP_SUMMARY"
          echo "${LABEL}: ${MIB} MiB (${BYTES} bytes)"

          case "$TARGET" in
            aarch64-*) WANT_ARCH=aarch64 ;;
            x86_64-*)  WANT_ARCH=x86_64 ;;
            *)         WANT_ARCH=unknown ;;
          esac

          if [ "${RUNNER_OS}" = "macOS" ]; then
            ARCHS=$(lipo -archs "$BIN")
            echo "lipo -archs → ${ARCHS}"
            if [ "$WANT_ARCH" = "aarch64" ]; then WANT_LIPO=arm64; else WANT_LIPO=x86_64; fi
            case " ${ARCHS} " in
              *" ${WANT_LIPO} "*) ;;
              *) echo "::error::期望 ${WANT_LIPO}，实际 ${ARCHS}"; exit 1 ;;
            esac
          elif [ "${RUNNER_OS}" = "Linux" ]; then
            INFO=$(file -b "$BIN")
            echo "file → ${INFO}"
            if [ "$WANT_ARCH" = "aarch64" ]; then
              case "$INFO" in *aarch64*|*arm64*) ;; *) echo "::error::架构不符：${INFO}"; exit 1 ;; esac
            else
              case "$INFO" in *x86-64*|*x86_64*) ;; *) echo "::error::架构不符：${INFO}"; exit 1 ;; esac
            fi
          else
            echo "Windows 产物不做架构断言：runner 自身架构即目标架构。"
          fi

      # artifact 名 = 六个 zip 的名字。Actions 下载时会自动打成同名 zip，
      # 所以手动触发下载到的就是「一个 zip 里一个可执行程序」。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  # 只有 Release 触发时才执行：把六个 artifact 各打成一个 zip 追加到该 Release。
  # 手动触发到上一个 job 就结束，产物在 Actions 本次运行的 artifacts 里下载。
  release:
    name: Attach zips to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Create release zips
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          command -v zip >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y zip
          }

          ROOT=$PWD
          mkdir -p assets

          # staging/<artifact 名>/<可执行程序> → assets/realesrgan-gui-<tag>-<平台>-<架构>.zip
          for DIR in staging/*/; do
            NAME=$(basename "$DIR")
            SUFFIX=${NAME#realesrgan-gui-}
            OUT="$ROOT/assets/realesrgan-gui-${TAG}-${SUFFIX}.zip"
            ( cd "$DIR" && zip -9 -j "$OUT" ./* >/dev/null )
            echo "已打包 $OUT"
          done

          COUNT=$(ls -1 assets/*.zip | wc -l)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::期望 6 个 zip，实际 $COUNT 个"
            ls -l assets
            exit 1
          fi

          ls -l assets
          {
            echo "### Release 资产"
            echo ""
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            for F in assets/*.zip; do
              echo "| $(basename "$F") | $(du -h "$F" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: assets/*.zip
          fail_on_unmatched_files: true
