name: build

# 推送到 master：三平台编译，产物上传到 Actions artifacts（日常开发不在本机跑 cargo）。
# 手动触发：同样三平台编译并上传 artifacts。
# 发布 Release 时触发：三平台编译并打包，产物上传到该 Release。
on:
  push:
    branches:
      - master
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # 某个平台卡在排队或挂死时，尽早失败，而不是让整条流水线挂在那里。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: realesrgan-gui-Windows
            binary: realesrgan-gui.exe
          - os: ubuntu-latest
            artifact: realesrgan-gui-Linux
            binary: realesrgan-gui
          # 这里固定 macOS 镜像，不用 macos-latest：
          # macos-latest 现在指向 macOS 26 的 arm64 镜像，而 arm64 托管机池长期排队，
          # job 拿不到机器就会被取消（annotations 里的 “The job was not acquired by
          # Runner of type hosted even after multiple attempts”），整条 build 流水线
          # 因此失败，即使 Linux / Windows 两边都已经构建成功。
          # 固定到 x64 镜像后机池稳定；arm64 的二进制不靠 arm64 runner，而是在这台
          # Intel 机器上交叉编译出两个切片再用 lipo 合成 universal2（见下面的构建步骤）。
          - os: macos-15-intel
            artifact: realesrgan-gui-macOS
            binary: realesrgan-gui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # 缓存键里带上 runner.arch：macOS 换了镜像架构以后，
          # 旧的 arm64 target 产物不能被恢复到 x64 机器上。
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev

      - name: Export build time
        shell: bash
        run: echo "REGUI_BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: cargo build --release --locked

      # macOS 产出 universal2 二进制：在 Intel 机器上分别编译 x86_64 与 arm64
      # 两个切片，再用 lipo 合成一个文件，这样同一个二进制在 Intel 和 Apple
      # Silicon 上都是原生执行，也不需要依赖长期排队的 arm64 托管机池。
      # 交叉编译 C 代码（libwebp）由 cc-rs 自动加 `-arch arm64` 和当前 SDK 处理。
      - name: Build macOS universal (x86_64 + arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/realesrgan-gui \
            target/aarch64-apple-darwin/release/realesrgan-gui \
            -output target/release/realesrgan-gui
          ARCHS=$(lipo -archs target/release/realesrgan-gui)
          echo "universal binary architectures: ${ARCHS}"
          echo "### macOS 产物架构：${ARCHS}" >> "$GITHUB_STEP_SUMMARY"
          case "$ARCHS" in *x86_64*) ;; *) echo "missing x86_64 slice"; exit 1 ;; esac
          case "$ARCHS" in *arm64*) ;; *) echo "missing arm64 slice"; exit 1 ;; esac

      # 把真实二进制体积写进 Actions 摘要，方便持续跟踪体积变化。
      - name: Report binary size
        shell: bash
        run: |
          BIN="target/release/${{ matrix.binary }}"
          BYTES=$(wc -c < "$BIN")
          MIB=$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "### ${RUNNER_OS} 产物体积：${MIB} MiB（${BYTES} 字节）" >> "$GITHUB_STEP_SUMMARY"
          echo "${RUNNER_OS}: ${MIB} MiB (${BYTES} bytes)"

      # 发布流程需要这些 artifacts 作为中转，所以两种触发方式都上传。
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          compression-level: 9

  # 只有 Release 触发时才打包并上传到 Release 资产；
  # 手动触发时到这里结束，产物在 Actions 的 artifacts 里下载。
  release:
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/download-artifact@v4
        with:
          name: realesrgan-gui-Windows
          path: dist-Windows
      - uses: actions/download-artifact@v4
        with:
          name: realesrgan-gui-Linux
          path: dist-Linux
      - uses: actions/download-artifact@v4
        with:
          name: realesrgan-gui-macOS
          path: dist-macOS

      - name: Create release assets
        id: vars
        run: |
          # https://github.com/xinntao/Real-ESRGAN/releases
          REAL_ESRGAN_VERSION=v0.2.5.0
          REAL_ESRGAN_RELEASE_TIME=20220424
          REAL_ESRGAN_PLATFORM=

          mkdir release

          for BUILD_OS in "Windows" "Linux" "macOS"; do
            if [ $BUILD_OS == "Windows" ]; then
              REAL_ESRGAN_PLATFORM=windows
              BINARY_NAME=realesrgan-gui.exe
            else
              BINARY_NAME=realesrgan-gui
              if [ $BUILD_OS == "Linux" ]; then
                REAL_ESRGAN_PLATFORM=ubuntu
              else
                REAL_ESRGAN_PLATFORM=macos
              fi
            fi

            cd "dist-${BUILD_OS}"
            wget \
              -nv \
              -O realesrgan-ncnn-vulkan.zip \
              "https://github.com/xinntao/Real-ESRGAN/releases/download/${REAL_ESRGAN_VERSION}/realesrgan-ncnn-vulkan-${REAL_ESRGAN_RELEASE_TIME}-${REAL_ESRGAN_PLATFORM}.zip"
            unzip -o realesrgan-ncnn-vulkan.zip
            rm -f realesrgan-ncnn-vulkan.zip input.jpg input2.jpg onepiece_demo.mp4
            cp ../README.md README_gui.md
            cp ../README.en-US.md README_gui.en-US.md
            cp ../README.uk-UA.md README_gui.uk-UA.md
            cp ../README.tr-TR.md README_gui.tr-TR.md

            if [ $BUILD_OS == "Windows" ]; then
              7z a \
                ../release/realesrgan-gui-${REAL_ESRGAN_PLATFORM}.7z \
                ${BINARY_NAME} \
                -mx9 -mfb256 -md1g -ms
              7z a \
                ../release/realesrgan-gui-${REAL_ESRGAN_PLATFORM}-bundled-${REAL_ESRGAN_VERSION}.7z \
                . \
                -mx9 -mfb256 -md1g -ms
            else
              chmod +x ${BINARY_NAME} realesrgan-ncnn-vulkan
              XZ_OPT=-e9 tar Jcvf \
                ../release/realesrgan-gui-${REAL_ESRGAN_PLATFORM}.tar.xz \
                --transform "s,^\./,realesrgan-gui/," \
                ./${BINARY_NAME}
              XZ_OPT=-e9 tar Jcvf \
                ../release/realesrgan-gui-${REAL_ESRGAN_PLATFORM}-bundled-${REAL_ESRGAN_VERSION}.tar.xz \
                --transform "s,^\./,realesrgan-gui/," \
                .
            fi

            cd ..
          done

          echo "release_files<<EOF" >> $GITHUB_OUTPUT
          find release -type f >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.vars.outputs.release_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
